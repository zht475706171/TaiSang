<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>code-reader agent</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
<style>
  :root {
    --bg: #1a1a1a; --bg-2: #242424; --bg-3: #2e2e2e;
    --border: #3a3a3a; --text: #e4e4e4; --text-dim: #999;
    --accent: #6c8eff; --accent-2: #4a6a8e;
    --user-bubble: #2a3a5a; --ai-bubble: #2e2e2e;
    --ok: #6ec86e; --warn: #e0a458; --err: #e06c6c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

  /* 左侧会话列表 */
  #sidebar { width: 260px; background: var(--bg-2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  #sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  #sidebar-header h2 { font-size: 14px; font-weight: 600; color: var(--text-dim); }
  #new-session-btn { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  #new-session-btn:hover { background: var(--accent-2); }
  #session-list { flex: 1; overflow-y: auto; padding: 8px; }
  .session-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .session-item:hover { background: var(--bg-3); }
  .session-item.active { background: var(--accent-2); color: white; }
  .session-item .del { color: var(--text-dim); opacity: 0; font-size: 14px; padding: 0 4px; }
  .session-item:hover .del { opacity: 0.6; }
  .session-item .del:hover { opacity: 1; color: var(--err); }

  /* 中间对话区 */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar { padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--bg-2); display: flex; justify-content: space-between; align-items: center; }
  #topbar h1 { font-size: 15px; font-weight: 500; }
  #topbar-actions { display: flex; gap: 8px; }
  #topbar-actions button { background: var(--bg-3); color: var(--text-dim); border: 1px solid var(--border); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  #topbar-actions button:hover { color: var(--text); border-color: var(--text-dim); }
  #topbar-actions button.active { color: var(--accent); border-color: var(--accent); }

  #messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: white; }
  .msg.ai { align-self: flex-start; background: var(--ai-bubble); border: 1px solid var(--border); }
  .msg.ai p { margin: 0.4em 0; }
  .msg.ai p:first-child { margin-top: 0; }
  .msg.ai p:last-child { margin-bottom: 0; }
  .msg.ai pre { background: #0d1117; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 0.5em 0; font-size: 13px; }
  .msg.ai code { font-family: "Consolas", "Courier New", monospace; }
  .msg.ai :not(pre) > code { background: #3a3a3a; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
  .msg.ai ul, .msg.ai ol { margin: 0.4em 0; padding-left: 1.5em; }
  .msg.ai a { color: var(--accent); }

  /* 工具/思考卡片 */
  .tool-card, .thinking, .compacted, .confirm-card { align-self: flex-start; max-width: 80%; margin: 0; }
  .tool-card { background: var(--bg-3); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; font-size: 13px; }
  .tool-card-header { padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; user-select: none; }
  .tool-card-header:hover { background: var(--bg-2); }
  .tool-card-header .arrow { color: var(--text-dim); transition: transform 0.2s; }
  .tool-card.expanded .arrow { transform: rotate(90deg); }
  .tool-card-header .name { color: var(--accent); font-family: monospace; }
  .tool-card-header .args { color: var(--text-dim); }
  .tool-card-header .bytes { margin-left: auto; color: var(--text-dim); font-size: 11px; }
  .tool-card-body { padding: 8px 12px; border-top: 1px solid var(--border); display: none; white-space: pre-wrap; font-family: monospace; max-height: 300px; overflow-y: auto; color: var(--text-dim); }
  .tool-card.expanded .tool-card-body { display: block; }

  .thinking { color: var(--text-dim); font-size: 13px; padding: 4px 0; display: flex; align-items: center; gap: 6px; }
  .thinking .dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); animation: bounce 1.4s infinite ease-in-out both; }
  .thinking .dots span:nth-child(1) { animation-delay: -0.32s; }
  .thinking .dots span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

  .compacted { color: var(--warn); font-size: 12px; font-style: italic; }

  .confirm-card { background: var(--bg-3); border: 1px solid var(--warn); border-radius: 8px; padding: 12px; }
  .confirm-card .title { color: var(--warn); font-size: 13px; margin-bottom: 6px; }
  .confirm-card .path { font-family: monospace; font-size: 12px; color: var(--text); margin-bottom: 8px; word-break: break-all; }
  .confirm-card .diff { font-family: monospace; font-size: 11px; color: var(--text-dim); margin-bottom: 8px; white-space: pre-wrap; max-height: 120px; overflow-y: auto; background: var(--bg); padding: 6px; border-radius: 4px; }
  .confirm-card .actions { display: flex; gap: 8px; }
  .confirm-card button { padding: 4px 12px; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; font-size: 12px; background: var(--bg-3); color: var(--text); }
  .confirm-card button.approve { background: var(--ok); color: white; border-color: var(--ok); }
  .confirm-card button.deny { background: var(--err); color: white; border-color: var(--err); }
  .confirm-card.answered button { opacity: 0.5; cursor: not-allowed; }

  .usage { font-size: 11px; color: var(--text-dim); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
  .run-error { color: var(--err); font-size: 13px; padding: 8px 12px; background: rgba(224,108,108,0.1); border-radius: 6px; align-self: flex-start; }

  /* 底部输入 */
  #input-area { padding: 16px 24px; border-top: 1px solid var(--border); background: var(--bg-2); }
  #input-wrap { display: flex; gap: 12px; align-items: flex-end; max-width: 900px; margin: 0 auto; }
  #query-input { flex: 1; background: var(--bg-3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; font-family: inherit; resize: none; min-height: 44px; max-height: 200px; }
  #query-input:focus { outline: none; border-color: var(--accent); }
  #send-btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #send-btn:hover { background: var(--accent-2); }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .empty-hint { text-align: center; color: var(--text-dim); margin-top: 80px; font-size: 14px; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h2>会话</h2>
    <button id="new-session-btn">+ 新建</button>
  </div>
  <div id="session-list"></div>
</div>

<div id="main">
  <div id="topbar">
    <h1 id="current-title">code-reader agent</h1>
    <div id="topbar-actions">
      <button id="reset-btn" title="清空当前会话上下文">/reset</button>
      <button id="debug-btn" title="切换调试输出(打印发给 LLM 的 messages)">/debug</button>
    </div>
  </div>
  <div id="messages">
    <div class="empty-hint">点击左侧 + 新建会话开始对话</div>
  </div>
  <div id="input-area">
    <div id="input-wrap">
      <textarea id="query-input" placeholder="输入问题,Enter 发送,Shift+Enter 换行..." rows="1"></textarea>
      <button id="send-btn">发送</button>
    </div>
  </div>
</div>

<script>
// ========== 全局态 ==========
let currentSessionId = null;
let eventSource = null;
let debugOn = false;
let pendingConfirm = null;  // {token, cardEl}

// marked + hljs 配置
marked.setOptions({
  highlight: (code, lang) => {
    if (lang && hljs.getLanguage(lang)) {
      try { return hljs.highlight(code, {language: lang}).value; } catch (e) {}
    }
    return hljs.highlightAuto(code).value;
  },
  breaks: true,
});

// ========== 会话列表 ==========
async function loadSessions() {
  const r = await fetch('/api/sessions');
  const list = await r.json();
  const box = document.getElementById('session-list');
  box.innerHTML = '';
  for (const s of list) {
    const el = document.createElement('div');
    el.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
    el.innerHTML = `<span>${escapeHtml(s.title)}</span><span class="del" data-id="${s.id}">×</span>`;
    el.addEventListener('click', (e) => {
      if (e.target.classList.contains('del')) {
        e.stopPropagation();
        deleteSession(s.id);
      } else {
        switchSession(s.id, s.title);
      }
    });
    box.appendChild(el);
  }
}

async function newSession() {
  const title = '会话 ' + new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
  const r = await fetch('/api/sessions', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({title})});
  const data = await r.json();
  await loadSessions();
  switchSession(data.id, data.title);
}

async function deleteSession(id) {
  if (!confirm('删除这个会话?')) return;
  await fetch(`/api/sessions/${id}`, {method: 'DELETE'});
  if (id === currentSessionId) {
    if (eventSource) { eventSource.close(); eventSource = null; }
    currentSessionId = null;
    document.getElementById('messages').innerHTML = '<div class="empty-hint">点击左侧 + 新建会话开始对话</div>';
    document.getElementById('current-title').textContent = 'code-reader agent';
  }
  await loadSessions();
}

function switchSession(id, title) {
  if (eventSource) eventSource.close();
  currentSessionId = id;
  document.getElementById('current-title').textContent = title || id;
  document.getElementById('messages').innerHTML = '';
  loadSessions();
  openEventStream(id);
}

// ========== SSE 流 ==========
function openEventStream(id) {
  if (eventSource) eventSource.close();
  eventSource = new EventSource(`/api/sessions/${id}/events`);
  eventSource.addEventListener('llm_thinking', (e) => renderThinking());
  eventSource.addEventListener('tool_call', (e) => renderToolCall(JSON.parse(e.data)));
  eventSource.addEventListener('tool_result', (e) => renderToolResult(JSON.parse(e.data)));
  eventSource.addEventListener('final_answer', (e) => renderFinalAnswer(JSON.parse(e.data)));
  eventSource.addEventListener('compacted', (e) => renderCompacted(JSON.parse(e.data)));
  eventSource.addEventListener('usage_report', (e) => renderUsage(JSON.parse(e.data)));
  eventSource.addEventListener('confirm_request', (e) => renderConfirm(JSON.parse(e.data)));
  eventSource.addEventListener('run_error', (e) => renderRunError(JSON.parse(e.data)));
  eventSource.addEventListener('run_end', (e) => clearThinking());
  // debug 事件(默认隐藏,debug 开关控制)
  eventSource.addEventListener('debug_request', (e) => { if (debugOn) renderDebug('REQUEST', JSON.parse(e.data)); });
  eventSource.addEventListener('debug_response', (e) => { if (debugOn) renderDebug('RESPONSE', JSON.parse(e.data)); });
  eventSource.addEventListener('debug_tool_result', (e) => { if (debugOn) renderDebug('TOOL_RESULT', JSON.parse(e.data)); });
}

// ========== 渲染 ==========
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderThinking() {
  const box = document.getElementById('messages');
  let el = box.querySelector('.thinking.current');
  if (!el) {
    el = document.createElement('div');
    el.className = 'thinking current';
    el.innerHTML = '思考中 <span class="dots"><span></span><span></span><span></span></span>';
    box.appendChild(el);
  }
  scrollToBottom();
}

function clearThinking() {
  const el = document.querySelector('.thinking.current');
  if (el) el.remove();
}

function renderToolCall(data) {
  clearThinking();
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'tool-card';
  el.dataset.name = data.name;
  el.innerHTML = `
    <div class="tool-card-header">
      <span class="arrow">▶</span>
      <span class="name">🔧 ${escapeHtml(data.name)}</span>
      <span class="args">${escapeHtml(JSON.stringify(data.args))}</span>
    </div>
    <div class="tool-card-body">执行中...</div>`;
  el.querySelector('.tool-card-header').addEventListener('click', () => el.classList.toggle('expanded'));
  box.appendChild(el);
  scrollToBottom();
}

function renderToolResult(data) {
  const box = document.getElementById('messages');
  // 找最后一个 tool-card 且 name 匹配的,填入结果
  const cards = box.querySelectorAll('.tool-card');
  let target = null;
  for (const c of cards) {
    if (c.dataset.name === data.name && !c.dataset.filled) target = c;
  }
  if (target) {
    target.dataset.filled = '1';
    target.querySelector('.tool-card-body').textContent = data.preview || '(无输出)';
    target.querySelector('.args').textContent = `${data.name} · ${data.total_bytes} bytes`;
  } else {
    // 没匹配到,新建一个已展开的卡片
    const el = document.createElement('div');
    el.className = 'tool-card expanded';
    el.dataset.name = data.name;
    el.innerHTML = `
      <div class="tool-card-header">
        <span class="arrow">▶</span>
        <span class="name">🔧 ${escapeHtml(data.name)}</span>
        <span class="args">${data.total_bytes} bytes</span>
      </div>
      <div class="tool-card-body">${escapeHtml(data.preview || '(无输出)')}</div>`;
    el.querySelector('.tool-card-header').addEventListener('click', () => el.classList.toggle('expanded'));
    box.appendChild(el);
  }
  scrollToBottom();
}

function renderFinalAnswer(data) {
  clearThinking();
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg ai';
  el.innerHTML = marked.parse(data.text || '');
  box.appendChild(el);
  // 给代码块应用 hljs
  el.querySelectorAll('pre code').forEach(b => { try { hljs.highlightElement(b); } catch (e) {} });
  scrollToBottom();
}

function renderCompacted(data) {
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'compacted';
  el.textContent = `📦 上下文已压缩 (via ${data.via})`;
  box.appendChild(el);
  scrollToBottom();
}

function renderUsage(data) {
  const box = document.getElementById('messages');
  // 找最后一个 AI 气泡,append usage;否则单独一行
  let target = box.querySelector('.msg.ai:last-child');
  if (!target) {
    target = document.createElement('div');
    target.className = 'msg ai';
    target.innerHTML = '<span style="color:var(--text-dim)">(无内容)</span>';
    box.appendChild(target);
  }
  const u = document.createElement('div');
  u.className = 'usage';
  const t = data.turn, s = data.session;
  let html = `此轮: prompt=${t.prompt} completion=${t.completion} total=${t.total} · 累计: ${s.total}`;
  if (data.cache && data.cache.available) {
    const hit = data.cache.cached_tokens || 0;
    const rate = t.prompt ? (hit / t.prompt * 100).toFixed(1) : '0.0';
    html += ` · cache ${rate}%`;
  } else {
    html += ` · cache N/A`;
  }
  u.textContent = html;
  target.appendChild(u);
  scrollToBottom();
}

function renderConfirm(data) {
  clearThinking();
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'confirm-card';
  el.dataset.token = data.token;
  const diffHtml = data.old
    ? `<div class="diff">- ${escapeHtml(data.old.slice(0, 500))}\n+ ${escapeHtml(data.new.slice(0, 500))}</div>`
    : `<div class="diff">(新文件,${data.new.length} chars)</div>`;
  el.innerHTML = `
    <div class="title">⚠️ Agent 想修改文件</div>
    <div class="path">${escapeHtml(data.file_path)}</div>
    ${diffHtml}
    <div class="actions">
      <button class="approve">允许</button>
      <button class="deny">拒绝</button>
    </div>`;
  el.querySelector('.approve').addEventListener('click', () => respondConfirm(data.token, true, el));
  el.querySelector('.deny').addEventListener('click', () => respondConfirm(data.token, false, el));
  box.appendChild(el);
  scrollToBottom();
}

async function respondConfirm(token, approve, el) {
  el.classList.add('answered');
  el.querySelectorAll('button').forEach(b => b.disabled = true);
  await fetch(`/api/sessions/${currentSessionId}/confirm/${token}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({approve})
  });
  el.querySelector('.title').textContent = approve ? '✅ 已允许' : '❌ 已拒绝';
}

function renderRunError(data) {
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'run-error';
  el.textContent = '❌ ' + (data.error || 'unknown error');
  box.appendChild(el);
  scrollToBottom();
}

function renderDebug(kind, data) {
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'tool-card expanded';
  const summary = kind === 'REQUEST'
    ? `step=${data.step} msgs=${data.messages.length} tools=${data.tools.length}`
    : kind === 'RESPONSE'
    ? `step=${data.step} text=${(data.text||'').slice(0,40)} calls=${(data.tool_calls||[]).length}`
    : `step=${data.step} ${data.name}`;
  el.innerHTML = `
    <div class="tool-card-header"><span class="arrow">▶</span><span class="name">🐛 DEBUG ${kind}</span><span class="args">${escapeHtml(summary)}</span></div>
    <div class="tool-card-body">${escapeHtml(JSON.stringify(data, null, 2))}</div>`;
  el.querySelector('.tool-card-header').addEventListener('click', () => el.classList.toggle('expanded'));
  box.appendChild(el);
  scrollToBottom();
}

function scrollToBottom() {
  const box = document.getElementById('messages');
  box.scrollTop = box.scrollHeight;
}

// ========== 发消息 ==========
async function sendMessage() {
  const input = document.getElementById('query-input');
  const text = input.value.trim();
  if (!text || !currentSessionId) {
    if (!currentSessionId) alert('请先新建会话');
    return;
  }
  // 渲染用户气泡
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg user';
  el.textContent = text;
  box.appendChild(el);
  input.value = '';
  input.style.height = 'auto';
  scrollToBottom();
  // POST 给后端,事件经 SSE 流回来
  await fetch(`/api/sessions/${currentSessionId}/messages`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({query: text})
  });
}

// ========== 顶部按钮 ==========
document.getElementById('new-session-btn').addEventListener('click', newSession);
document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('query-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('query-input').addEventListener('input', (e) => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 200) + 'px';
});

document.getElementById('reset-btn').addEventListener('click', async () => {
  if (!currentSessionId) return;
  if (!confirm('清空当前会话上下文?(session memory 笔记保留)')) return;
  await fetch(`/api/sessions/${currentSessionId}/reset`, {method: 'POST'});
  document.getElementById('messages').innerHTML = '';
  appendSystemNote('上下文已重置');
});

document.getElementById('debug-btn').addEventListener('click', async () => {
  if (!currentSessionId) return;
  debugOn = !debugOn;
  document.getElementById('debug-btn').classList.toggle('active', debugOn);
  await fetch(`/api/sessions/${currentSessionId}/debug`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({on: debugOn})
  });
});

function appendSystemNote(text) {
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'compacted';
  el.textContent = 'ℹ️ ' + text;
  box.appendChild(el);
  scrollToBottom();
}

// ========== 启动 ==========
loadSessions();
</script>
</body>
</html>
