<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaiSang · coding agent</title>
<style>
  /* IBM Plex 本地化字体(从 Google Fonts CDN 改本地,避免国内访问超时) */
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('/static/fonts/IBMPlexMono-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('/static/fonts/IBMPlexMono-Medium.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('/static/fonts/IBMPlexMono-SemiBold.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('/static/fonts/IBMPlexSans-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('/static/fonts/IBMPlexSans-Medium.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('/static/fonts/IBMPlexSans-SemiBold.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('/static/fonts/IBMPlexSans-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
<style>
  :root {
    /* Inkwell palette: deep blue-black ink + warm cream + amber accent */
    --bg: #16191f;
    --bg-2: #1d2128;
    --bg-3: #262b34;
    --bg-4: #2f3540;
    --border: #2f3540;
    --border-soft: #232830;
    --text: #e6e0d0;
    --text-2: #a8a395;
    --text-3: #6b6857;
    --amber: #d4a543;
    --amber-dim: #8a6b2a;
    --amber-soft: rgba(212, 165, 67, 0.15);
    --red: #c95d4a;
    --green: #7a9d6e;
    --sky: #6b8fa8;
    --user-bubble: #2a3548;
    --user-bubble-border: #3a4862;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
  ::selection { background: var(--amber-soft); color: var(--text); }

  /* ===== 左侧会话列表(git log 风格) ===== */
  #sidebar {
    width: 280px;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  #brand {
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--border-soft);
  }
  #brand .mark {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: 18px;
    color: var(--text);
    letter-spacing: 0.02em;
  }
  #brand .mark .diamond { color: var(--amber); margin-right: 8px; }
  #brand .tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--text-3);
    margin-top: 4px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  #new-session-wrap {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border-soft);
  }
  #new-session-btn {
    width: 100%;
    background: transparent;
    color: var(--text);
    border: 1px dashed var(--border);
    padding: 9px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-family: "IBM Plex Mono", monospace;
    text-align: left;
    transition: all 0.15s;
  }
  #new-session-btn:hover {
    border-color: var(--amber);
    color: var(--amber);
    background: var(--amber-soft);
  }
  #new-session-btn .plus { color: var(--amber); margin-right: 8px; font-weight: 600; }
  #session-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .session-item {
    padding: 10px 16px 10px 18px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 3px;
    border-left: 3px solid transparent;
    transition: background 0.12s;
    position: relative;
  }
  .session-item:hover { background: var(--bg-3); }
  .session-item.active {
    background: var(--bg-3);
    border-left-color: var(--amber);
  }
  .session-item .subject {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-right: 22px;
  }
  .session-item.active .subject { color: var(--amber); }
  .session-item .meta {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--text-3);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .session-item .meta .dot { color: var(--bg-4); }
  .session-item .del {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-3);
    opacity: 0;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 3px;
    transition: opacity 0.12s, color 0.12s;
  }
  .session-item:hover .del { opacity: 0.7; }
  .session-item .del:hover { opacity: 1; color: var(--red); background: var(--bg-4); }
  #session-list-empty {
    padding: 24px 20px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--text-3);
    text-align: center;
  }

  /* ===== 中间对话区 ===== */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 56px;
  }
  #topbar .label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-right: 10px;
  }
  #current-title {
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #current-title.empty { color: var(--text-3); font-style: italic; }
  #topbar-actions { display: flex; gap: 6px; }
  #topbar-actions button {
    background: transparent;
    color: var(--text-2);
    border: 1px solid var(--border);
    padding: 5px 12px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
    font-family: "IBM Plex Mono", monospace;
    transition: all 0.12s;
  }
  #topbar-actions button:hover {
    color: var(--amber);
    border-color: var(--amber-dim);
  }
  #topbar-actions button.active {
    color: var(--amber);
    border-color: var(--amber);
    background: var(--amber-soft);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-width: 920px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 8px;
    line-height: 1.65;
    font-size: 14px;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: var(--text);
    border: 1px solid var(--user-bubble-border);
    border-radius: 12px 12px 3px 12px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-left: 2px solid var(--amber-dim);
    border-radius: 4px 12px 12px 4px;
    max-width: 82%;
  }
  .msg.ai p { margin: 0.5em 0; }
  .msg.ai p:first-child { margin-top: 0; }
  .msg.ai p:last-child { margin-bottom: 0; }
  .msg.ai pre {
    background: #0d1117;
    padding: 12px 14px;
    border-radius: 4px;
    overflow-x: auto;
    margin: 0.6em 0;
    font-size: 13px;
    border: 1px solid var(--border);
  }
  .msg.ai code { font-family: "IBM Plex Mono", monospace; }
  .msg.ai :not(pre) > code {
    background: var(--bg-3);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 12.5px;
    color: var(--amber);
  }
  .msg.ai ul, .msg.ai ol { margin: 0.5em 0; padding-left: 1.6em; }
  .msg.ai li { margin: 0.2em 0; }
  .msg.ai a { color: var(--amber); text-decoration: none; border-bottom: 1px dotted var(--amber-dim); }
  .msg.ai a:hover { border-bottom-style: solid; }
  .msg.ai h1, .msg.ai h2, .msg.ai h3 {
    font-family: "IBM Plex Sans", sans-serif;
    margin: 0.8em 0 0.4em;
    color: var(--text);
  }
  .msg.ai h1 { font-size: 17px; }
  .msg.ai h2 { font-size: 15px; }
  .msg.ai h3 { font-size: 14px; color: var(--text-2); }

  /* 工具卡片(终端日志风) */
  .tool-card, .thinking, .compacted, .confirm-card, .run-error, .debug-card {
    align-self: flex-start;
    max-width: 82%;
    margin: 0;
  }
  .tool-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-left: 2px solid var(--amber-dim);
    border-radius: 4px;
    overflow: hidden;
    font-size: 13px;
    width: 100%;
    max-width: 600px;
  }
  .tool-card-header {
    padding: 8px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
    transition: background 0.12s;
  }
  .tool-card-header:hover { background: var(--bg-3); }
  .tool-card-header .arrow {
    color: var(--text-3);
    transition: transform 0.15s;
    font-size: 10px;
  }
  .tool-card.expanded .arrow { transform: rotate(90deg); }
  .tool-card-header .name {
    color: var(--amber);
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
  }
  .tool-card-header .args {
    color: var(--text-3);
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .tool-card-header .bytes {
    margin-left: auto;
    color: var(--text-3);
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
  }
  .tool-card-body {
    padding: 10px 12px;
    border-top: 1px solid var(--border-soft);
    display: none;
    white-space: pre-wrap;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    max-height: 320px;
    overflow-y: auto;
    color: var(--text-2);
    line-height: 1.5;
  }
  .tool-card.expanded .tool-card-body { display: block; }

  /* 思考动画(琥珀点) */
  .thinking {
    color: var(--text-2);
    font-size: 13px;
    font-family: "IBM Plex Mono", monospace;
    padding: 6px 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .thinking .label { color: var(--text-3); }
  .thinking .dots { display: inline-flex; gap: 4px; }
  .thinking .dots span {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--amber);
    animation: pulse 1.4s infinite ease-in-out both;
  }
  .thinking .dots span:nth-child(1) { animation-delay: -0.32s; }
  .thinking .dots span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  .compacted {
    color: var(--amber);
    font-size: 12px;
    font-family: "IBM Plex Mono", monospace;
    font-style: italic;
    padding: 4px 8px;
    border-left: 2px solid var(--amber-dim);
    background: var(--amber-soft);
    border-radius: 0 3px 3px 0;
  }

  .confirm-card {
    background: var(--bg-2);
    border: 1px solid var(--amber-dim);
    border-left: 2px solid var(--amber);
    border-radius: 4px;
    padding: 14px 16px;
    width: 100%;
    max-width: 560px;
  }
  .confirm-card .title {
    color: var(--amber);
    font-size: 13px;
    font-family: "IBM Plex Mono", monospace;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .confirm-card .path {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--text);
    margin-bottom: 10px;
    word-break: break-all;
    padding: 6px 8px;
    background: var(--bg);
    border-radius: 3px;
  }
  .confirm-card .diff {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    color: var(--text-2);
    margin-bottom: 10px;
    white-space: pre-wrap;
    max-height: 140px;
    overflow-y: auto;
    background: var(--bg);
    padding: 8px 10px;
    border-radius: 3px;
    border: 1px solid var(--border-soft);
  }
  .confirm-card .diff .del-line { color: var(--red); }
  .confirm-card .diff .add-line { color: var(--green); }
  .confirm-card .actions { display: flex; gap: 8px; }
  .confirm-card button {
    padding: 5px 16px;
    border-radius: 3px;
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 12px;
    font-family: "IBM Plex Mono", monospace;
    background: transparent;
    color: var(--text-2);
    transition: all 0.12s;
  }
  .confirm-card button.approve {
    color: var(--green);
    border-color: var(--green);
  }
  .confirm-card button.approve:hover {
    background: var(--green);
    color: var(--bg);
  }
  .confirm-card button.deny {
    color: var(--red);
    border-color: var(--red);
  }
  .confirm-card button.deny:hover {
    background: var(--red);
    color: var(--bg);
  }
  .confirm-card.answered button { opacity: 0.4; cursor: not-allowed; }
  .confirm-card.answered button:hover { background: transparent; color: inherit; }

  /* 权限卡片:问用户是否允许 agent 访问某目录。色调用 sky(信息性,非破坏) */
  .permission-card {
    align-self: flex-start;
    max-width: 82%;
    margin: 0;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-left: 2px solid var(--sky);
    border-radius: 4px;
    padding: 14px 16px;
    width: 100%;
    max-width: 560px;
  }
  .permission-card .title {
    color: var(--sky);
    font-size: 13px;
    font-family: "IBM Plex Mono", monospace;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .permission-card .path {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--text);
    margin-bottom: 10px;
    word-break: break-all;
    padding: 6px 8px;
    background: var(--bg);
    border-radius: 3px;
  }
  .permission-card .actions { display: flex; gap: 8px; }
  .permission-card button {
    padding: 5px 16px;
    border-radius: 3px;
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 12px;
    font-family: "IBM Plex Mono", monospace;
    background: transparent;
    color: var(--text-2);
    transition: all 0.12s;
  }
  .permission-card button.approve {
    color: var(--green);
    border-color: var(--green);
  }
  .permission-card button.approve:hover {
    background: var(--green);
    color: var(--bg);
  }
  .permission-card button.deny {
    color: var(--text-2);
    border-color: var(--border);
  }
  .permission-card button.deny:hover {
    background: var(--bg);
    color: var(--text);
  }
  .permission-card.answered button { opacity: 0.4; cursor: not-allowed; }
  .permission-card.answered button:hover { background: transparent; color: inherit; }

  .usage {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--text-3);
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--border-soft);
  }
  .run-error {
    color: var(--red);
    font-size: 13px;
    font-family: "IBM Plex Mono", monospace;
    padding: 10px 14px;
    background: rgba(201, 93, 74, 0.08);
    border-left: 2px solid var(--red);
    border-radius: 0 3px 3px 0;
  }

  /* 底部输入 */
  #input-area {
    padding: 14px 24px 18px;
    border-top: 1px solid var(--border);
    background: var(--bg-2);
  }
  #input-wrap {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: 920px;
    margin: 0 auto;
  }
  #query-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: "IBM Plex Sans", sans-serif;
    resize: none;
    min-height: 44px;
    max-height: 200px;
    line-height: 1.5;
    transition: border-color 0.12s;
  }
  #query-input::placeholder { color: var(--text-3); }
  #query-input:focus {
    outline: none;
    border-color: var(--amber-dim);
  }
  #send-btn {
    background: var(--amber);
    color: var(--bg);
    border: none;
    padding: 10px 22px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    letter-spacing: 0.04em;
    transition: all 0.12s;
  }
  #send-btn:hover { background: #e3b654; }
  #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .empty-hint {
    text-align: center;
    color: var(--text-3);
    margin-top: 120px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
  }
  .empty-hint .glyph {
    display: block;
    font-size: 32px;
    color: var(--bg-4);
    margin-bottom: 12px;
  }
</style>
</head>
<body>

<div id="sidebar">
  <div id="brand">
    <div class="mark"><span class="diamond">◆</span>TaiSang</div>
    <div class="tag">coding agent</div>
  </div>
  <div id="new-session-wrap">
    <button id="new-session-btn"><span class="plus">+</span>new session</button>
  </div>
  <div id="session-list"></div>
</div>

<div id="main">
  <div id="topbar">
    <span class="label">session</span>
    <h1 id="current-title" class="empty">未选择会话</h1>
    <div id="topbar-actions">
      <button id="reset-btn" title="清空当前会话上下文(session memory 笔记保留)">/reset</button>
      <button id="debug-btn" title="切换调试输出(打印发给 LLM 的完整 messages)">/debug</button>
    </div>
  </div>
  <div id="messages">
    <div class="empty-hint"><span class="glyph">◆</span>点击左侧 + new session 开始对话</div>
  </div>
  <div id="input-area">
    <div id="input-wrap">
      <textarea id="query-input" placeholder="输入问题,Enter 发送,Shift+Enter 换行..." rows="1"></textarea>
      <button id="send-btn">SEND</button>
    </div>
  </div>
</div>

<script>
// ========== 全局态 ==========
let currentSessionId = null;
let eventSource = null;
let debugOn = false;

marked.setOptions({
  highlight: (code, lang) => {
    if (lang && hljs.getLanguage(lang)) {
      try { return hljs.highlight(code, {language: lang}).value; } catch (e) {}
    }
    return hljs.highlightAuto(code).value;
  },
  breaks: true,
});

// ========== 工具 ==========
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function displayTitle(s) {
  // 空标题 → 显示占位;前端不动后端数据
  return s.title && s.title.trim() ? s.title : '新会话';
}
function scrollToBottom() {
  const box = document.getElementById('messages');
  box.scrollTop = box.scrollHeight;
}

// ========== 会话列表 ==========
async function loadSessions() {
  const r = await fetch('/api/sessions');
  const list = await r.json();
  const box = document.getElementById('session-list');
  box.innerHTML = '';
  if (!list.length) {
    const empty = document.createElement('div');
    empty.id = 'session-list-empty';
    empty.textContent = 'no sessions yet';
    box.appendChild(empty);
    return;
  }
  for (const s of list) {
    const el = document.createElement('div');
    el.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
    const title = displayTitle(s);
    const rel = s.relative_time || '';
    el.innerHTML = `
      <div class="subject">${escapeHtml(title)}</div>
      <div class="meta">
        <span>${escapeHtml(rel)}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(s.id)}</span>
      </div>
      <span class="del" title="删除会话">×</span>`;
    el.addEventListener('click', (e) => {
      if (e.target.classList.contains('del')) {
        e.stopPropagation();
        deleteSession(s.id);
      } else {
        switchSession(s.id, title);
      }
    });
    box.appendChild(el);
  }
}

async function newSession() {
  // 不传 title — 后端保持空,首条消息触发 set_title_from_query 自动取首句
  const r = await fetch('/api/sessions', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title: ''})
  });
  const data = await r.json();
  await loadSessions();
  switchSession(data.id, '');
}

async function deleteSession(id) {
  if (!confirm('删除这个会话?')) return;
  await fetch(`/api/sessions/${id}`, {method: 'DELETE'});
  if (id === currentSessionId) {
    if (eventSource) { eventSource.close(); eventSource = null; }
    currentSessionId = null;
    document.getElementById('messages').innerHTML = '<div class="empty-hint"><span class="glyph">◆</span>点击左侧 + new session 开始对话</div>';
    const titleEl = document.getElementById('current-title');
    titleEl.textContent = '未选择会话';
    titleEl.classList.add('empty');
  }
  await loadSessions();
}

function switchSession(id, title) {
  if (eventSource) eventSource.close();
  currentSessionId = id;
  const titleEl = document.getElementById('current-title');
  titleEl.textContent = title || '新会话';
  titleEl.classList.toggle('empty', !title);
  document.getElementById('messages').innerHTML = '';
  loadSessions();
  openEventStream(id);
}

// ========== SSE 流 ==========
function openEventStream(id) {
  if (eventSource) eventSource.close();
  eventSource = new EventSource(`/api/sessions/${id}/events`);
  eventSource.addEventListener('llm_thinking', () => renderThinking());
  eventSource.addEventListener('tool_call', (e) => renderToolCall(JSON.parse(e.data)));
  eventSource.addEventListener('tool_result', (e) => renderToolResult(JSON.parse(e.data)));
  eventSource.addEventListener('final_answer', (e) => renderFinalAnswer(JSON.parse(e.data)));
  eventSource.addEventListener('compacted', (e) => renderCompacted(JSON.parse(e.data)));
  eventSource.addEventListener('usage_report', (e) => renderUsage(JSON.parse(e.data)));
  eventSource.addEventListener('confirm_request', (e) => renderConfirm(JSON.parse(e.data)));
  eventSource.addEventListener('permission_request', (e) => renderPermission(JSON.parse(e.data)));
  eventSource.addEventListener('run_error', (e) => renderRunError(JSON.parse(e.data)));
  eventSource.addEventListener('run_end', () => clearThinking());
  eventSource.addEventListener('session_title_updated', (e) => {
    const data = JSON.parse(e.data);
    if (data.id === currentSessionId) {
      const titleEl = document.getElementById('current-title');
      titleEl.textContent = data.title || '新会话';
      titleEl.classList.toggle('empty', !data.title);
    }
    loadSessions();  // 刷新左侧列表(新 title 落定)
  });
  // debug 事件
  eventSource.addEventListener('debug_request', (e) => { if (debugOn) renderDebug('REQUEST', JSON.parse(e.data)); });
  eventSource.addEventListener('debug_response', (e) => { if (debugOn) renderDebug('RESPONSE', JSON.parse(e.data)); });
  eventSource.addEventListener('debug_tool_result', (e) => { if (debugOn) renderDebug('TOOL_RESULT', JSON.parse(e.data)); });
}

// ========== 渲染 ==========
function renderThinking() {
  const box = document.getElementById('messages');
  let el = box.querySelector('.thinking.current');
  if (!el) {
    el = document.createElement('div');
    el.className = 'thinking current';
    el.innerHTML = '<span class="label">thinking</span><span class="dots"><span></span><span></span><span></span></span>';
    box.appendChild(el);
  }
  scrollToBottom();
}

function clearThinking() {
  const el = document.querySelector('.thinking.current');
  if (el) el.remove();
}

function renderToolCall(data) {
  clearThinking();
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'tool-card';
  el.dataset.name = data.name;
  el.innerHTML = `
    <div class="tool-card-header">
      <span class="arrow">▶</span>
      <span class="name">${escapeHtml(data.name)}</span>
      <span class="args">${escapeHtml(JSON.stringify(data.args))}</span>
    </div>
    <div class="tool-card-body">执行中...</div>`;
  el.querySelector('.tool-card-header').addEventListener('click', () => el.classList.toggle('expanded'));
  box.appendChild(el);
  scrollToBottom();
}

function renderToolResult(data) {
  const box = document.getElementById('messages');
  const cards = box.querySelectorAll('.tool-card');
  let target = null;
  for (const c of cards) {
    if (c.dataset.name === data.name && !c.dataset.filled) target = c;
  }
  if (target) {
    target.dataset.filled = '1';
    target.querySelector('.tool-card-body').textContent = data.preview || '(无输出)';
    target.querySelector('.args').textContent = `${data.total_bytes} bytes`;
  } else {
    const el = document.createElement('div');
    el.className = 'tool-card expanded';
    el.dataset.name = data.name;
    el.innerHTML = `
      <div class="tool-card-header">
        <span class="arrow">▶</span>
        <span class="name">${escapeHtml(data.name)}</span>
        <span class="args">${data.total_bytes} bytes</span>
      </div>
      <div class="tool-card-body">${escapeHtml(data.preview || '(无输出)')}</div>`;
    el.querySelector('.tool-card-header').addEventListener('click', () => el.classList.toggle('expanded'));
    box.appendChild(el);
  }
  scrollToBottom();
}

function renderFinalAnswer(data) {
  clearThinking();
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg ai';
  el.innerHTML = marked.parse(data.text || '');
  box.appendChild(el);
  el.querySelectorAll('pre code').forEach(b => { try { hljs.highlightElement(b); } catch (e) {} });
  scrollToBottom();
}

function renderCompacted(data) {
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'compacted';
  el.textContent = `context compacted via ${data.via}`;
  box.appendChild(el);
  scrollToBottom();
}

function renderUsage(data) {
  const box = document.getElementById('messages');
  let target = box.querySelector('.msg.ai:last-child');
  if (!target) {
    target = document.createElement('div');
    target.className = 'msg ai';
    target.innerHTML = '<span style="color:var(--text-3)">(no content)</span>';
    box.appendChild(target);
  }
  const u = document.createElement('div');
  u.className = 'usage';
  const t = data.turn, s = data.session;
  let html = `turn: prompt=${t.prompt} completion=${t.completion} total=${t.total} · session: ${s.total}`;
  if (data.cache && data.cache.available) {
    const hit = data.cache.cached_tokens || 0;
    const rate = t.prompt ? (hit / t.prompt * 100).toFixed(1) : '0.0';
    html += ` · cache ${rate}%`;
  } else {
    html += ` · cache N/A`;
  }
  u.textContent = html;
  target.appendChild(u);
  scrollToBottom();
}

function renderConfirm(data) {
  clearThinking();
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'confirm-card';
  el.dataset.token = data.token;
  const diffHtml = data.old
    ? `<div class="diff"><span class="del-line">- ${escapeHtml(data.old.slice(0, 500))}</span>\n<span class="add-line">+ ${escapeHtml(data.new.slice(0, 500))}</span></div>`
    : `<div class="diff">(new file, ${data.new.length} chars)</div>`;
  el.innerHTML = `
    <div class="title">▸ agent wants to modify a file</div>
    <div class="path">${escapeHtml(data.file_path)}</div>
    ${diffHtml}
    <div class="actions">
      <button class="approve">allow</button>
      <button class="deny">deny</button>
    </div>`;
  el.querySelector('.approve').addEventListener('click', () => respondConfirm(data.token, true, el));
  el.querySelector('.deny').addEventListener('click', () => respondConfirm(data.token, false, el));
  box.appendChild(el);
  scrollToBottom();
}

async function respondConfirm(token, approve, el) {
  el.classList.add('answered');
  el.querySelectorAll('button').forEach(b => b.disabled = true);
  await fetch(`/api/sessions/${currentSessionId}/confirm/${token}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({approve})
  });
  el.querySelector('.title').textContent = approve ? '✓ allowed' : '✗ denied';
}

function renderPermission(data) {
  clearThinking();
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'permission-card';
  el.dataset.token = data.token;
  el.innerHTML = `
    <div class="title">▸ agent wants to access a directory</div>
    <div class="path">${escapeHtml(data.path)}</div>
    <div class="actions">
      <button class="approve">allow</button>
      <button class="deny">deny</button>
    </div>`;
  el.querySelector('.approve').addEventListener('click', () => respondPermission(data.token, true, el));
  el.querySelector('.deny').addEventListener('click', () => respondPermission(data.token, false, el));
  box.appendChild(el);
  scrollToBottom();
}

async function respondPermission(token, approve, el) {
  el.classList.add('answered');
  el.querySelectorAll('button').forEach(b => b.disabled = true);
  await fetch(`/api/sessions/${currentSessionId}/permission/${token}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({approve})
  });
  el.querySelector('.title').textContent = approve ? '✓ allowed' : '✗ denied';
}

function renderRunError(data) {
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'run-error';
  el.textContent = 'error: ' + (data.error || 'unknown error');
  box.appendChild(el);
  scrollToBottom();
}

function renderDebug(kind, data) {
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'tool-card expanded';
  const summary = kind === 'REQUEST'
    ? `step=${data.step} msgs=${data.messages.length} tools=${data.tools.length}`
    : kind === 'RESPONSE'
    ? `step=${data.step} text=${(data.text||'').slice(0,40)} calls=${(data.tool_calls||[]).length}`
    : `step=${data.step} ${data.name}`;
  el.innerHTML = `
    <div class="tool-card-header"><span class="arrow">▶</span><span class="name">debug.${kind.toLowerCase()}</span><span class="args">${escapeHtml(summary)}</span></div>
    <div class="tool-card-body">${escapeHtml(JSON.stringify(data, null, 2))}</div>`;
  el.querySelector('.tool-card-header').addEventListener('click', () => el.classList.toggle('expanded'));
  box.appendChild(el);
  scrollToBottom();
}

// ========== 发消息 ==========
async function sendMessage() {
  const input = document.getElementById('query-input');
  const text = input.value.trim();
  if (!text || !currentSessionId) {
    if (!currentSessionId) alert('请先新建会话');
    return;
  }
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg user';
  el.textContent = text;
  box.appendChild(el);
  input.value = '';
  input.style.height = 'auto';
  scrollToBottom();
  await fetch(`/api/sessions/${currentSessionId}/messages`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({query: text})
  });
}

// ========== 顶部按钮 ==========
document.getElementById('new-session-btn').addEventListener('click', newSession);
document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('query-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('query-input').addEventListener('input', (e) => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 200) + 'px';
});

document.getElementById('reset-btn').addEventListener('click', async () => {
  if (!currentSessionId) return;
  if (!confirm('清空当前会话上下文?(session memory 笔记保留)')) return;
  await fetch(`/api/sessions/${currentSessionId}/reset`, {method: 'POST'});
  document.getElementById('messages').innerHTML = '';
  appendSystemNote('context reset');
});

document.getElementById('debug-btn').addEventListener('click', async () => {
  if (!currentSessionId) return;
  debugOn = !debugOn;
  document.getElementById('debug-btn').classList.toggle('active', debugOn);
  await fetch(`/api/sessions/${currentSessionId}/debug`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({on: debugOn})
  });
});

function appendSystemNote(text) {
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'compacted';
  el.textContent = '· ' + text;
  box.appendChild(el);
  scrollToBottom();
}

// ========== 启动 ==========
loadSessions();
</script>
</body>
</html>
