<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaiSang · coding agent</title>
<style>
  /* IBM Plex 本地化字体(从 Google Fonts CDN 改本地,避免国内访问超时) */
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('/static/fonts/IBMPlexMono-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('/static/fonts/IBMPlexMono-Medium.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('/static/fonts/IBMPlexMono-SemiBold.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('/static/fonts/IBMPlexSans-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('/static/fonts/IBMPlexSans-Medium.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('/static/fonts/IBMPlexSans-SemiBold.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    src: url('/static/fonts/IBMPlexSans-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
</style>
<!-- 浅色代码高亮主题,匹配纸白底 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
<style>
  :root {
    /* Inkwell-on-paper:暖纸白 + 墨黑 + 朱砂印泥 accent */
    --paper: #f7f4ec;
    --paper-2: #efebe0;
    --paper-3: #e6e0cf;
    --ink: #1c1b18;
    --ink-2: #4a4842;
    --ink-3: #8a877c;
    --rule: #d9d3c4;
    --rule-soft: #e3ddce;
    --accent: #a8341a;
    --accent-dim: #c25a3e;
    --accent-soft: rgba(168, 52, 26, 0.10);
    --ok: #5a7a52;
    --info: #3a6a8a;
    --user-bubble: #e8e3d2;
    --user-bubble-border: #d4ceb8;
    --code-bg: #efebe0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--paper);
    color: var(--ink);
    height: 100vh;
    display: flex;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--paper-3); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }
  ::selection { background: var(--accent-soft); color: var(--ink); }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ===== 左侧会话列表 ===== */
  #sidebar {
    width: 260px;
    background: var(--paper-2);
    border-right: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  #brand {
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--rule-soft);
  }
  #brand .mark {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
    letter-spacing: 0.02em;
  }
  #brand .mark .diamond { color: var(--accent); margin-right: 8px; }
  #brand .tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 4px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  #new-session-wrap {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--rule-soft);
  }
  #new-session-btn {
    width: 100%;
    background: transparent;
    color: var(--ink);
    border: 1px dashed var(--rule);
    padding: 9px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-family: "IBM Plex Mono", monospace;
    text-align: left;
    transition: all 0.15s;
  }
  #new-session-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  #new-session-btn .plus { color: var(--accent); margin-right: 8px; font-weight: 600; }
  #session-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .session-item {
    padding: 10px 16px 10px 18px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 3px;
    transition: background 0.12s;
    position: relative;
  }
  .session-item:hover { background: var(--paper-3); }
  .session-item.active {
    background: var(--paper-3);
  }
  /* signature:active 会话用朱砂实心方块(印章隐喻),不用左 border bar */
  .session-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 1px;
  }
  .session-item .subject {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-right: 22px;
  }
  .session-item.active .subject { color: var(--accent); font-weight: 500; }
  .session-item .meta {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-3);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .session-item .meta .dot { color: var(--rule); }
  .session-item .del {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-3);
    opacity: 0;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 3px;
    transition: opacity 0.12s, color 0.12s;
  }
  .session-item:hover .del { opacity: 0.7; }
  .session-item .del:hover { opacity: 1; color: var(--accent); background: var(--paper); }
  #session-list-empty {
    padding: 24px 20px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-3);
    text-align: center;
  }

  /* ===== 中间对话区 ===== */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    padding: 14px 24px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 56px;
  }
  #topbar .label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-right: 10px;
  }
  #current-title {
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #current-title.empty { color: var(--ink-3); font-style: italic; }
  #topbar-actions { display: flex; gap: 6px; }
  #topbar-actions button {
    background: transparent;
    color: var(--ink-2);
    border: 1px solid var(--rule);
    padding: 5px 12px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
    font-family: "IBM Plex Mono", monospace;
    transition: all 0.12s;
  }
  #topbar-actions button:hover {
    color: var(--accent);
    border-color: var(--accent-dim);
  }
  #topbar-actions button.active {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-width: 920px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 8px;
    line-height: 1.65;
    font-size: 14px;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: var(--ink);
    border: 1px solid var(--user-bubble-border);
    border-radius: 12px 12px 3px 12px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-left: 2px solid var(--accent);
    border-radius: 4px 12px 12px 4px;
    max-width: 82%;
    color: var(--ink);
  }
  .msg.ai p { margin: 0.5em 0; }
  .msg.ai p:first-child { margin-top: 0; }
  .msg.ai p:last-child { margin-bottom: 0; }
  .msg.ai pre {
    background: var(--code-bg);
    padding: 12px 14px;
    border-radius: 4px;
    overflow-x: auto;
    margin: 0.6em 0;
    font-size: 13px;
    border: 1px solid var(--rule);
  }
  .msg.ai code { font-family: "IBM Plex Mono", monospace; }
  .msg.ai :not(pre) > code {
    background: var(--paper-3);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 12.5px;
    color: var(--accent);
  }
  .msg.ai ul, .msg.ai ol { margin: 0.5em 0; padding-left: 1.6em; }
  .msg.ai li { margin: 0.2em 0; }
  .msg.ai a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent-dim); }
  .msg.ai a:hover { border-bottom-style: solid; }
  .msg.ai h1, .msg.ai h2, .msg.ai h3 {
    font-family: "IBM Plex Sans", sans-serif;
    margin: 0.8em 0 0.4em;
    color: var(--ink);
  }
  .msg.ai h1 { font-size: 17px; }
  .msg.ai h2 { font-size: 15px; }
  .msg.ai h3 { font-size: 14px; color: var(--ink-2); }

  /* 工具卡片 */
  .tool-card, .thinking, .compacted, .confirm-card, .permission-card, .run-error, .debug-card {
    align-self: flex-start;
    max-width: 82%;
    margin: 0;
  }
  .tool-card {
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-left: 2px solid var(--accent);
    border-radius: 4px;
    overflow: hidden;
    font-size: 13px;
    width: 100%;
    max-width: 600px;
  }
  .tool-card-header {
    padding: 8px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
    transition: background 0.12s;
  }
  .tool-card-header:hover { background: var(--paper-3); }
  .tool-card-header .arrow {
    color: var(--ink-3);
    transition: transform 0.15s;
    font-size: 10px;
  }
  .tool-card.expanded .arrow { transform: rotate(90deg); }
  .tool-card-header .name {
    color: var(--accent);
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
  }
  .tool-card-header .args {
    color: var(--ink-3);
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .tool-card-header .bytes {
    margin-left: auto;
    color: var(--ink-3);
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
  }
  .tool-card-body {
    padding: 10px 12px;
    border-top: 1px solid var(--rule-soft);
    display: none;
    white-space: pre-wrap;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    max-height: 320px;
    overflow-y: auto;
    color: var(--ink-2);
    line-height: 1.5;
  }
  .tool-card.expanded .tool-card-body { display: block; }

  /* 思考动画(朱砂点) */
  .thinking {
    color: var(--ink-2);
    font-size: 13px;
    font-family: "IBM Plex Mono", monospace;
    padding: 6px 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .thinking .label { color: var(--ink-3); }
  .thinking .dots { display: inline-flex; gap: 4px; }
  .thinking .dots span {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.4s infinite ease-in-out both;
  }
  .thinking .dots span:nth-child(1) { animation-delay: -0.32s; }
  .thinking .dots span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .thinking .dots span { animation: none; opacity: 0.6; }
  }

  .compacted {
    color: var(--accent);
    font-size: 12px;
    font-family: "IBM Plex Mono", monospace;
    font-style: italic;
    padding: 4px 8px;
    border-left: 2px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 3px 3px 0;
  }

  .confirm-card, .permission-card {
    background: var(--paper-2);
    border-radius: 4px;
    padding: 14px 16px;
    width: 100%;
    max-width: 560px;
  }
  .confirm-card {
    border: 1px solid var(--accent-dim);
    border-left: 2px solid var(--accent);
  }
  .permission-card {
    border: 1px solid var(--rule);
    border-left: 2px solid var(--info);
  }
  .confirm-card .title, .permission-card .title {
    font-size: 13px;
    font-family: "IBM Plex Mono", monospace;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .confirm-card .title { color: var(--accent); }
  .permission-card .title { color: var(--info); }
  .confirm-card .path, .permission-card .path {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink);
    margin-bottom: 10px;
    word-break: break-all;
    padding: 6px 8px;
    background: var(--paper);
    border-radius: 3px;
  }
  .confirm-card .diff {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    color: var(--ink-2);
    margin-bottom: 10px;
    white-space: pre-wrap;
    max-height: 140px;
    overflow-y: auto;
    background: var(--paper);
    padding: 8px 10px;
    border-radius: 3px;
    border: 1px solid var(--rule-soft);
  }
  .confirm-card .diff .del-line { color: var(--accent); }
  .confirm-card .diff .add-line { color: var(--ok); }
  .confirm-card .actions, .permission-card .actions { display: flex; gap: 8px; }
  .confirm-card button, .permission-card button {
    padding: 5px 16px;
    border-radius: 3px;
    border: 1px solid var(--rule);
    cursor: pointer;
    font-size: 12px;
    font-family: "IBM Plex Mono", monospace;
    background: transparent;
    color: var(--ink-2);
    transition: all 0.12s;
  }
  .confirm-card button.approve, .permission-card button.approve {
    color: var(--ok);
    border-color: var(--ok);
  }
  .confirm-card button.approve:hover, .permission-card button.approve:hover {
    background: var(--ok);
    color: var(--paper);
  }
  .confirm-card button.deny, .permission-card button.deny {
    color: var(--accent);
    border-color: var(--accent-dim);
  }
  .confirm-card button.deny:hover, .permission-card button.deny:hover {
    background: var(--accent);
    color: var(--paper);
  }
  .confirm-card.answered button, .permission-card.answered button {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .confirm-card.answered button:hover, .permission-card.answered button:hover {
    background: transparent;
    color: inherit;
  }

  .usage {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--rule-soft);
  }
  .run-error {
    color: var(--accent);
    font-size: 13px;
    font-family: "IBM Plex Mono", monospace;
    padding: 10px 14px;
    background: var(--accent-soft);
    border-left: 2px solid var(--accent);
    border-radius: 0 3px 3px 0;
  }

  /* 底部输入 */
  #input-area {
    padding: 14px 24px 18px;
    border-top: 1px solid var(--rule);
    background: var(--paper-2);
  }
  #input-wrap {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: 920px;
    margin: 0 auto;
  }
  #query-input {
    flex: 1;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 10px 14px;
    color: var(--ink);
    font-size: 14px;
    font-family: "IBM Plex Sans", sans-serif;
    resize: none;
    min-height: 44px;
    max-height: 200px;
    line-height: 1.5;
    transition: border-color 0.12s;
  }
  #query-input::placeholder { color: var(--ink-3); }
  #query-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  #send-btn {
    background: var(--accent);
    color: var(--paper);
    border: none;
    padding: 10px 22px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    letter-spacing: 0.04em;
    transition: background 0.12s;
  }
  #send-btn:hover { background: #8f2a14; }
  #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .empty-hint {
    text-align: center;
    color: var(--ink-3);
    margin-top: 120px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
  }
  .empty-hint .glyph {
    display: block;
    font-size: 32px;
    color: var(--rule);
    margin-bottom: 12px;
  }
</style>
</head>
<body>

<div id="sidebar">
  <div id="brand">
    <div class="mark"><span class="diamond">◆</span>TaiSang</div>
    <div class="tag">coding agent</div>
  </div>
  <div id="new-session-wrap">
    <button id="new-session-btn"><span class="plus">+</span>新对话</button>
  </div>
  <div id="session-list"></div>
</div>

<div id="main">
  <div id="topbar">
    <span class="label">session</span>
    <h1 id="current-title" class="empty">未选择会话</h1>
    <div id="topbar-actions">
      <button id="reset-btn" title="清空当前会话上下文(session memory 笔记保留)">/reset</button>
      <button id="debug-btn" title="切换调试输出(打印发给 LLM 的完整 messages)">/debug</button>
    </div>
  </div>
  <div id="messages">
    <div class="empty-hint"><span class="glyph">◆</span>点击左侧 + 新对话 开始</div>
  </div>
  <div id="input-area">
    <div id="input-wrap">
      <textarea id="query-input" placeholder="输入问题,Enter 发送,Shift+Enter 换行..." rows="1"></textarea>
      <button id="send-btn">发送</button>
    </div>
  </div>
</div>

<script>
// ========== 全局态 ==========
let currentSessionId = null;
let eventSource = null;
let debugOn = false;

marked.setOptions({
  highlight: (code, lang) => {
    if (lang && hljs.getLanguage(lang)) {
      try { return hljs.highlight(code, {language: lang}).value; } catch (e) {}
    }
    return hljs.highlightAuto(code).value;
  },
  breaks: true,
});

// ========== 工具 ==========
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function displayTitle(s) {
  // 空标题 → 显示占位;前端不动后端数据
  return s.title && s.title.trim() ? s.title : '新会话';
}
function scrollToBottom() {
  const box = document.getElementById('messages');
  box.scrollTop = box.scrollHeight;
}

// ========== 会话列表 ==========
async function loadSessions() {
  const r = await fetch('/api/sessions');
  const list = await r.json();
  const box = document.getElementById('session-list');
  box.innerHTML = '';
  if (!list.length) {
    const empty = document.createElement('div');
    empty.id = 'session-list-empty';
    empty.textContent = '还没有会话';
    box.appendChild(empty);
    return;
  }
  for (const s of list) {
    const el = document.createElement('div');
    el.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
    const title = displayTitle(s);
    const rel = s.relative_time || '';
    el.innerHTML = `
      <div class="subject">${escapeHtml(title)}</div>
      <div class="meta">
        <span>${escapeHtml(rel)}</span>
        <span class="dot">·</span>
        <span>${escapeHtml(s.id)}</span>
      </div>
      <span class="del" title="删除会话">×</span>`;
    el.addEventListener('click', (e) => {
      if (e.target.classList.contains('del')) {
        e.stopPropagation();
        deleteSession(s.id);
      } else {
        switchSession(s.id, title);
      }
    });
    box.appendChild(el);
  }
}

async function newSession() {
  // 不传 title — 后端保持空,首条消息触发 set_title_from_query 自动取首句
  const r = await fetch('/api/sessions', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title: ''})
  });
  const data = await r.json();
  await loadSessions();
  switchSession(data.id, '');
}

async function deleteSession(id) {
  if (!confirm('删除这个会话?')) return;
  await fetch(`/api/sessions/${id}`, {method: 'DELETE'});
  if (id === currentSessionId) {
    if (eventSource) { eventSource.close(); eventSource = null; }
    currentSessionId = null;
    document.getElementById('messages').innerHTML = '<div class="empty-hint"><span class="glyph">◆</span>点击左侧 + 新对话 开始</div>';
    const titleEl = document.getElementById('current-title');
    titleEl.textContent = '未选择会话';
    titleEl.classList.add('empty');
  }
  await loadSessions();
}

async function switchSession(id, title) {
  if (eventSource) eventSource.close();
  currentSessionId = id;
  const titleEl = document.getElementById('current-title');
  titleEl.textContent = title || '新会话';
  titleEl.classList.toggle('empty', !title);
  document.getElementById('messages').innerHTML = '';
  // 拉历史并渲染(resume)
  try {
    const r = await fetch(`/api/sessions/${id}/messages`);
    if (r.ok) {
      const history = await r.json();
      renderHistory(history);
    }
  } catch (e) {
    console.error('load history failed:', e);
  }
  loadSessions();  // 刷新左侧 active 状态
  openEventStream(id);
}

// ========== SSE 流 ==========
function openEventStream(id) {
  if (eventSource) eventSource.close();
  eventSource = new EventSource(`/api/sessions/${id}/events`);
  eventSource.addEventListener('llm_thinking', () => renderThinking());
  eventSource.addEventListener('tool_call', (e) => renderToolCall(JSON.parse(e.data)));
  eventSource.addEventListener('tool_result', (e) => renderToolResult(JSON.parse(e.data)));
  eventSource.addEventListener('final_answer', (e) => renderFinalAnswer(JSON.parse(e.data)));
  eventSource.addEventListener('compacted', (e) => renderCompacted(JSON.parse(e.data)));
  eventSource.addEventListener('usage_report', (e) => renderUsage(JSON.parse(e.data)));
  eventSource.addEventListener('confirm_request', (e) => renderConfirm(JSON.parse(e.data)));
  eventSource.addEventListener('permission_request', (e) => renderPermission(JSON.parse(e.data)));
  eventSource.addEventListener('run_error', (e) => renderRunError(JSON.parse(e.data)));
  eventSource.addEventListener('run_end', () => clearThinking());
  eventSource.addEventListener('session_title_updated', (e) => {
    const data = JSON.parse(e.data);
    if (data.id === currentSessionId) {
      const titleEl = document.getElementById('current-title');
      titleEl.textContent = data.title || '新会话';
      titleEl.classList.toggle('empty', !data.title);
    }
    loadSessions();  // 刷新左侧列表(新 title 落定)
  });
  // debug 事件
  eventSource.addEventListener('debug_request', (e) => { if (debugOn) renderDebug('REQUEST', JSON.parse(e.data)); });
  eventSource.addEventListener('debug_response', (e) => { if (debugOn) renderDebug('RESPONSE', JSON.parse(e.data)); });
  eventSource.addEventListener('debug_tool_result', (e) => { if (debugOn) renderDebug('TOOL_RESULT', JSON.parse(e.data)); });
}

// ========== 渲染 ==========
function renderThinking() {
  const box = document.getElementById('messages');
  let el = box.querySelector('.thinking.current');
  if (!el) {
    el = document.createElement('div');
    el.className = 'thinking current';
    el.innerHTML = '<span class="label">thinking</span><span class="dots"><span></span><span></span><span></span></span>';
    box.appendChild(el);
  }
  scrollToBottom();
}

function clearThinking() {
  const el = document.querySelector('.thinking.current');
  if (el) el.remove();
}

function renderToolCall(data) {
  clearThinking();
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'tool-card';
  el.dataset.name = data.name;
  el.innerHTML = `
    <div class="tool-card-header">
      <span class="arrow">▶</span>
      <span class="name">${escapeHtml(data.name)}</span>
      <span class="args">${escapeHtml(JSON.stringify(data.args))}</span>
    </div>
    <div class="tool-card-body">执行中...</div>`;
  el.querySelector('.tool-card-header').addEventListener('click', () => el.classList.toggle('expanded'));
  box.appendChild(el);
  scrollToBottom();
}

function renderToolResult(data) {
  const box = document.getElementById('messages');
  const cards = box.querySelectorAll('.tool-card');
  let target = null;
  for (const c of cards) {
    if (c.dataset.name === data.name && !c.dataset.filled) target = c;
  }
  if (target) {
    target.dataset.filled = '1';
    target.querySelector('.tool-card-body').textContent = data.preview || '(无输出)';
    target.querySelector('.args').textContent = `${data.total_bytes} bytes`;
  } else {
    const el = document.createElement('div');
    el.className = 'tool-card expanded';
    el.dataset.name = data.name;
    el.innerHTML = `
      <div class="tool-card-header">
        <span class="arrow">▶</span>
        <span class="name">${escapeHtml(data.name)}</span>
        <span class="args">${data.total_bytes} bytes</span>
      </div>
      <div class="tool-card-body">${escapeHtml(data.preview || '(无输出)')}</div>`;
    el.querySelector('.tool-card-header').addEventListener('click', () => el.classList.toggle('expanded'));
    box.appendChild(el);
  }
  scrollToBottom();
}

function renderFinalAnswer(data) {
  clearThinking();
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg ai';
  el.innerHTML = marked.parse(data.text || '');
  box.appendChild(el);
  el.querySelectorAll('pre code').forEach(b => { try { hljs.highlightElement(b); } catch (e) {} });
  scrollToBottom();
}

function renderCompacted(data) {
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'compacted';
  el.textContent = `context compacted via ${data.via}`;
  box.appendChild(el);
  scrollToBottom();
}

// ========== 历史渲染(resume 时拉回来渲染) ==========
function renderHistory(records) {
  const box = document.getElementById('messages');
  for (const r of records) {
    if (r.role === 'user') {
      const el = document.createElement('div');
      el.className = 'msg user';
      el.textContent = r.content || '';
      box.appendChild(el);
    } else if (r.role === 'assistant') {
      renderFinalAnswer({text: r.content || ''});
      // 若该 assistant 有 tool_calls,渲染已展开的工具卡片
      if (r.tool_calls && r.tool_calls.length) {
        for (const tc of r.tool_calls) {
          const fn = tc.function || {};
          let args = {};
          try { args = JSON.parse(fn.arguments || '{}'); } catch (e) {}
          const el = document.createElement('div');
          el.className = 'tool-card expanded';
          el.dataset.name = fn.name;
          el.dataset.filled = '1';
          el.innerHTML = `
            <div class="tool-card-header">
              <span class="arrow">▶</span>
              <span class="name">${escapeHtml(fn.name || '')}</span>
              <span class="args">${escapeHtml(JSON.stringify(args))}</span>
            </div>
            <div class="tool-card-body">执行中...</div>`;
          el.querySelector('.tool-card-header').addEventListener('click', () => el.classList.toggle('expanded'));
          box.appendChild(el);
        }
      }
    } else if (r.role === 'tool') {
      // tool_result:补全上一个同名未填的 tool-card-body
      const cards = box.querySelectorAll('.tool-card');
      let target = null;
      for (const c of cards) {
        if (c.dataset.name === r.name && !c.dataset.filled) target = c;
      }
      const preview = (r.content || '').slice(0, 30);
      const bytes = (r.content || '').length;
      if (target) {
        target.dataset.filled = '1';
        target.querySelector('.tool-card-body').textContent = preview;
        target.querySelector('.args').textContent = `${bytes} bytes`;
      } else {
        const el = document.createElement('div');
        el.className = 'tool-card expanded';
        el.dataset.name = r.name;
        el.dataset.filled = '1';
        el.innerHTML = `
          <div class="tool-card-header">
            <span class="arrow">▶</span>
            <span class="name">${escapeHtml(r.name)}</span>
            <span class="args">${bytes} bytes</span>
          </div>
          <div class="tool-card-body">${escapeHtml(preview)}</div>`;
        el.querySelector('.tool-card-header').addEventListener('click', () => el.classList.toggle('expanded'));
        box.appendChild(el);
      }
    } else if (r.role === 'system' && typeof r.content === 'string' && r.content.startsWith('[compacted')) {
      const via = r.content.includes('session_memory') ? 'session_memory' : 'llm';
      renderCompacted({via});
    }
    // system role 的 SYSTEM_PROMPT(非 boundary)不渲染
  }
  scrollToBottom();
}

function renderUsage(data) {
  const box = document.getElementById('messages');
  let target = box.querySelector('.msg.ai:last-child');
  if (!target) {
    target = document.createElement('div');
    target.className = 'msg ai';
    target.innerHTML = '<span style="color:var(--ink-3)">(no content)</span>';
    box.appendChild(target);
  }
  const u = document.createElement('div');
  u.className = 'usage';
  const t = data.turn, s = data.session;
  let html = `turn: prompt=${t.prompt} completion=${t.completion} total=${t.total} · session: ${s.total}`;
  if (data.cache && data.cache.available) {
    const hit = data.cache.cached_tokens || 0;
    const rate = t.prompt ? (hit / t.prompt * 100).toFixed(1) : '0.0';
    html += ` · cache ${rate}%`;
  } else {
    html += ` · cache N/A`;
  }
  u.textContent = html;
  target.appendChild(u);
  scrollToBottom();
}

function renderConfirm(data) {
  clearThinking();
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'confirm-card';
  el.dataset.token = data.token;
  const diffHtml = data.old
    ? `<div class="diff"><span class="del-line">- ${escapeHtml(data.old.slice(0, 500))}</span>\n<span class="add-line">+ ${escapeHtml(data.new.slice(0, 500))}</span></div>`
    : `<div class="diff">(新文件, ${data.new.length} 字符)</div>`;
  el.innerHTML = `
    <div class="title">▸ agent 想修改文件</div>
    <div class="path">${escapeHtml(data.file_path)}</div>
    ${diffHtml}
    <div class="actions">
      <button class="approve">允许</button>
      <button class="deny">拒绝</button>
    </div>`;
  el.querySelector('.approve').addEventListener('click', () => respondConfirm(data.token, true, el));
  el.querySelector('.deny').addEventListener('click', () => respondConfirm(data.token, false, el));
  box.appendChild(el);
  scrollToBottom();
}

async function respondConfirm(token, approve, el) {
  el.classList.add('answered');
  el.querySelectorAll('button').forEach(b => b.disabled = true);
  await fetch(`/api/sessions/${currentSessionId}/confirm/${token}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({approve})
  });
  el.querySelector('.title').textContent = approve ? '✓ 已允许' : '✗ 已拒绝';
}

function renderPermission(data) {
  clearThinking();
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'permission-card';
  el.dataset.token = data.token;
  el.innerHTML = `
    <div class="title">▸ agent 想访问目录</div>
    <div class="path">${escapeHtml(data.path)}</div>
    <div class="actions">
      <button class="approve">允许</button>
      <button class="deny">拒绝</button>
    </div>`;
  el.querySelector('.approve').addEventListener('click', () => respondPermission(data.token, true, el));
  el.querySelector('.deny').addEventListener('click', () => respondPermission(data.token, false, el));
  box.appendChild(el);
  scrollToBottom();
}

async function respondPermission(token, approve, el) {
  el.classList.add('answered');
  el.querySelectorAll('button').forEach(b => b.disabled = true);
  await fetch(`/api/sessions/${currentSessionId}/permission/${token}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({approve})
  });
  el.querySelector('.title').textContent = approve ? '✓ 已允许' : '✗ 已拒绝';
}

function renderRunError(data) {
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'run-error';
  el.textContent = '错误: ' + (data.error || '未知错误');
  box.appendChild(el);
  scrollToBottom();
}

function renderDebug(kind, data) {
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'tool-card expanded';
  const summary = kind === 'REQUEST'
    ? `step=${data.step} msgs=${data.messages.length} tools=${data.tools.length}`
    : kind === 'RESPONSE'
    ? `step=${data.step} text=${(data.text||'').slice(0,40)} calls=${(data.tool_calls||[]).length}`
    : `step=${data.step} ${data.name}`;
  el.innerHTML = `
    <div class="tool-card-header"><span class="arrow">▶</span><span class="name">debug.${kind.toLowerCase()}</span><span class="args">${escapeHtml(summary)}</span></div>
    <div class="tool-card-body">${escapeHtml(JSON.stringify(data, null, 2))}</div>`;
  el.querySelector('.tool-card-header').addEventListener('click', () => el.classList.toggle('expanded'));
  box.appendChild(el);
  scrollToBottom();
}

// ========== 发消息 ==========
async function sendMessage() {
  const input = document.getElementById('query-input');
  const text = input.value.trim();
  if (!text || !currentSessionId) {
    if (!currentSessionId) alert('请先新建会话');
    return;
  }
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg user';
  el.textContent = text;
  box.appendChild(el);
  input.value = '';
  input.style.height = 'auto';
  scrollToBottom();
  await fetch(`/api/sessions/${currentSessionId}/messages`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({query: text})
  });
}

// ========== 顶部按钮 ==========
document.getElementById('new-session-btn').addEventListener('click', newSession);
document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('query-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('query-input').addEventListener('input', (e) => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 200) + 'px';
});

document.getElementById('reset-btn').addEventListener('click', async () => {
  if (!currentSessionId) return;
  if (!confirm('清空当前会话上下文?(session memory 笔记保留)')) return;
  await fetch(`/api/sessions/${currentSessionId}/reset`, {method: 'POST'});
  document.getElementById('messages').innerHTML = '';
  appendSystemNote('上下文已重置');
});

document.getElementById('debug-btn').addEventListener('click', async () => {
  if (!currentSessionId) return;
  debugOn = !debugOn;
  document.getElementById('debug-btn').classList.toggle('active', debugOn);
  await fetch(`/api/sessions/${currentSessionId}/debug`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({on: debugOn})
  });
});

function appendSystemNote(text) {
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'compacted';
  el.textContent = '· ' + text;
  box.appendChild(el);
  scrollToBottom();
}

// ========== 启动 ==========
loadSessions();
</script>
</body>
</html>
