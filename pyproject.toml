[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taisang"
version = "0.1.0"
description = "TaiSang - 简化版 Claude Code/Trae 式交互式 coding agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "泰哥" }]
dependencies = [
    "openai>=1.0",
    "click>=8.1",
    "structlog>=24.1",
    "tiktoken>=0.7",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "pre-commit>=3.7",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
taisang = "taisang.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# template.py 存放 prompt 长文本(中文字符串),行长难拆,放行 E501
"src/taisang/session_memory/template.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "tests/fixtures"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
